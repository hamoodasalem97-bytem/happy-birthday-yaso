<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
 
<body> 

<div class="container">

    <!-- الموسيقى -->
    <audio id="birthdayMusic" loop>
        <source src="aud.mp3" type="audio/mpeg">
    </audio>

    <!-- زر الموسيقى -->
    <button id="musicBtn">🎵 تشغيل الموسيقى</button> 

    <!-- الرسائل -->
    <div class="message">

        <div class="line">Happy Birthday 🎂</div>
        <div class="line">May God bless you 🍀</div>
        <div class="line">And give u many happiness 💕</div>
        <div class="line">Just saying... you're pretty awesome 🥹</div>
        <div class="line">Hope u have a great day today ❤️😘</div>
        

    </div>

    <!-- العد التنازلي -->
    <div class="counter">
        <span id="countdown">Loading...</span>
    </div>

    <canvas id="canvas"></canvas>

</div>

<script src="script.js"></script>

</body>
</html>
